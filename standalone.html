<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBSU — The Hall</title>
<meta name="description" content="Walk the IBSU hall in 3D and open the door you need: Programs, Tuition, Fees, Calculation, Trainings For Pupils, Open Day.">
<meta name="theme-color" content="#08090c">
<meta property="og:title" content="IBSU — The Hall">
<meta property="og:description" content="An interactive 3D hall. Walk to a door and open it.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090c'/%3E%3Crect x='8' y='4.5' width='16' height='23' fill='none' stroke='%23f0b978' stroke-width='2.2'/%3E%3Ccircle cx='20' cy='16.5' r='1.5' fill='%23f0b978'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#08090c;
    --gold:#f0b978;
    --gold-soft:rgba(240,185,120,.62);
    --text:#f2ece4;
    --dim:rgba(242,236,228,.55);
    --ui:'Outfit',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-weight:300;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none;outline:none}
  #scene.pointing{cursor:pointer}

  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.5;
    background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.03) 0,rgba(0,0,0,0) 60%);
    mix-blend-mode:screen;
  }
  .edge{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 200px 40px rgba(0,0,0,.75);
  }

  /* ---------- HUD ---------- */
  .hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:flex-start;
       justify-content:space-between;gap:16px;padding:clamp(16px,2.4vw,30px);pointer-events:none}
  .hud > *{pointer-events:auto}

  .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
  .logo .mark{
    font-size:clamp(21px,2.4vw,30px);font-weight:600;letter-spacing:.22em;
    color:var(--text);text-shadow:0 0 26px rgba(240,185,120,.45);
  }
  .logo .sub{
    max-width:16ch;font-size:clamp(8.5px,.95vw,10.5px);line-height:1.45;letter-spacing:.22em;
    text-transform:uppercase;color:var(--dim);
    border-left:1px solid rgba(240,185,120,.35);padding-left:12px;
  }
  @media (max-width:620px){ .logo .sub{display:none} }

  .btn{
    font-family:var(--ui);font-size:clamp(11px,1.15vw,13px);font-weight:400;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text);
    background:rgba(255,255,255,.045);border:1px solid rgba(240,185,120,.32);
    border-radius:999px;padding:.72em 1.3em;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:border-color .25s,background .25s,transform .25s;
  }
  .btn:hover,.btn:focus-visible{background:rgba(240,185,120,.14);border-color:var(--gold);transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}

  .index{position:relative}
  .index-panel{
    position:absolute;top:calc(100% + 12px);right:0;min-width:250px;margin:0;padding:8px;list-style:none;
    background:rgba(12,13,18,.86);border:1px solid rgba(240,185,120,.22);border-radius:16px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .index-panel[hidden]{display:none}
  .index-panel a{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:.7em .85em;border-radius:10px;text-decoration:none;color:var(--text);
    font-size:14px;letter-spacing:.04em;transition:background .2s,color .2s;
  }
  .index-panel a::after{content:'→';color:var(--gold-soft);transition:transform .2s}
  .index-panel a:hover,.index-panel a:focus-visible{background:rgba(240,185,120,.12);outline:none}
  .index-panel a:hover::after{transform:translateX(3px)}

  /* ---------- hint ---------- */
  .hint{
    position:fixed;left:50%;bottom:clamp(18px,3.4vh,34px);transform:translateX(-50%);z-index:6;
    margin:0;padding:.7em 1.4em;white-space:nowrap;pointer-events:none;
    font-size:clamp(10.5px,1.1vw,12.5px);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
    background:rgba(10,11,15,.5);border:1px solid rgba(255,255,255,.07);border-radius:999px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:opacity .8s ease;
  }
  .hint kbd{
    font:inherit;color:var(--text);border:1px solid rgba(255,255,255,.22);
    border-radius:5px;padding:.1em .45em;margin:0 .1em;
  }
  .hint.gone{opacity:0}
  @media (max-width:620px){ .hint .desktop-only{display:none} }

  /* ---------- on-screen arrow keys ---------- */
  .pad{
    position:fixed;right:clamp(16px,2.4vw,30px);bottom:clamp(16px,3vh,30px);z-index:7;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    gap:8px;touch-action:none;
  }
  .pad .key{
    width:clamp(46px,5.2vw,56px);height:clamp(46px,5.2vw,56px);
    display:grid;place-items:center;padding:0;cursor:pointer;
    font-family:var(--ui);font-size:19px;line-height:1;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid rgba(240,185,120,.3);
    border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:background .12s,border-color .12s,transform .12s,box-shadow .12s;
    -webkit-user-select:none;user-select:none;
  }
  .pad .key:hover{border-color:rgba(240,185,120,.6)}
  .pad .key.on{
    background:rgba(240,185,120,.9);border-color:#ffdcae;color:#120d07;
    transform:translateY(1px) scale(.97);box-shadow:0 0 22px rgba(240,185,120,.45);
  }
  .pad .key:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .pad .up{grid-area:1/2}
  .pad .left{grid-area:2/1}
  .pad .down{grid-area:2/2}
  .pad .right{grid-area:2/3}
  /* a gentle nudge until the walker is first moved */
  .pad.idle .key{animation:padHint 2.8s ease-in-out infinite}
  .pad.idle .up{animation-delay:.15s}
  @keyframes padHint{
    0%,72%,100%{border-color:rgba(240,185,120,.3)}
    80%{border-color:rgba(240,185,120,.85)}
  }
  @media (prefers-reduced-motion:reduce){ .pad.idle .key{animation:none} }
  @media (max-width:620px){
    .pad{left:50%;right:auto;transform:translateX(-50%);bottom:20px}
    .pad .key{width:58px;height:58px;font-size:22px}
    .hint{bottom:158px}
  }

  /* ---------- door popup ---------- */
  .modal{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;
    background:radial-gradient(80% 70% at 50% 50%,rgba(6,7,10,.72),rgba(4,5,7,.93));
    opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .modal.on{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(460px,100%);padding:clamp(30px,4vw,42px);text-align:center;
    background:linear-gradient(165deg,rgba(24,26,33,.94),rgba(11,12,16,.96));
    border:1px solid rgba(240,185,120,.26);border-radius:22px;
    box-shadow:0 40px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
    transform:translateY(18px) scale(.97);transition:transform .4s cubic-bezier(.2,.9,.3,1.05);
  }
  .modal.on .card{transform:none}
  .card::after{
    content:'';position:absolute;left:50%;top:-1px;width:52%;height:1px;transform:translateX(-50%);
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .kicker{margin:0 0 .85em;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-soft)}
  .card h2{margin:0 0 .5em;font-size:clamp(25px,3.4vw,34px);font-weight:600;letter-spacing:.01em;line-height:1.12}
  .card p.blurb{margin:0 0 2em;font-size:clamp(14px,1.5vw,15.5px);line-height:1.65;color:var(--dim)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .go{
    font-family:var(--ui);font-size:13px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
    text-decoration:none;color:#120d07;background:linear-gradient(180deg,#ffd9a8,var(--gold));
    border:1px solid rgba(255,220,175,.7);border-radius:999px;padding:.95em 1.7em;
    box-shadow:0 12px 34px rgba(240,185,120,.26);transition:transform .22s,box-shadow .22s;
  }
  .go:hover,.go:focus-visible{transform:translateY(-2px);box-shadow:0 18px 44px rgba(240,185,120,.38)}

  /* ---------- loader ---------- */
  .loader{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--bg);
    transition:opacity .8s ease,visibility .8s;
  }
  .loader.done{opacity:0;visibility:hidden}
  .loader .inner{text-align:center}
  .loader .mark{font-size:34px;font-weight:600;letter-spacing:.3em;color:var(--text)}
  .loader .bar{margin:20px auto 0;width:190px;height:1px;background:rgba(255,255,255,.12);overflow:hidden}
  .loader .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  .loader .err{margin-top:18px;font-size:13px;color:#ff9a8a;max-width:32ch;line-height:1.5}

  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<canvas id="scene" role="application"
        aria-label="Interactive 3D hall. Use the arrow keys to walk to a door, then press Enter to open it. Every door is also listed under the All doors button."></canvas>
<div class="grain"></div>
<div class="edge"></div>

<h1 class="sr">IBSU — walk the hall and open the door you need</h1>

<header class="hud">
  <a class="logo" href="https://ibsu.edu.ge/en/entrant/" target="_blank" rel="noopener"
     aria-label="IBSU, International Black Sea University — entrant pages">
    <span class="mark">IBSU</span>
    <span class="sub">International Black Sea University</span>
  </a>
  <div class="index">
    <button class="btn" id="indexBtn" aria-expanded="false" aria-controls="indexPanel">All doors</button>
    <ul class="index-panel" id="indexPanel" hidden></ul>
  </div>
</header>

<p class="hint" id="hint">
  <span class="desktop-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to walk &nbsp;·&nbsp; click the floor to go there &nbsp;·&nbsp; </span>click a door to open it
</p>

<div class="pad idle" id="pad" role="group" aria-label="Walk controls">
  <button class="key up" data-key="ArrowUp" type="button" aria-label="Walk forward">↑</button>
  <button class="key left" data-key="ArrowLeft" type="button" aria-label="Walk left">←</button>
  <button class="key down" data-key="ArrowDown" type="button" aria-label="Walk back">↓</button>
  <button class="key right" data-key="ArrowRight" type="button" aria-label="Walk right">→</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <p class="kicker">You opened the door to</p>
    <h2 id="mTitle">Programs</h2>
    <p class="blurb" id="mBlurb"></p>
    <div class="actions">
      <a class="go" id="mGo" href="https://ibsu.edu.ge/en/entrant/" target="_blank" rel="noopener">Enter the room</a>
      <button class="btn" id="mBack">Stay in the hall</button>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="inner">
    <div class="mark">IBSU</div>
    <div class="bar"><i></i></div>
    <p class="err" id="loadErr" hidden></p>
  </div>
</div>
