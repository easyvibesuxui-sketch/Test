<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBSU — The Hall</title>
<meta name="description" content="Walk the IBSU hall in 3D and open the door you need: Programs, Tuition, Fees, Calculation, Trainings For Pupils, Open Day.">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light">
<meta property="og:title" content="IBSU — The Hall">
<meta property="og:description" content="An interactive 3D hall. Walk to a door and open it.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f1ea'/%3E%3Crect x='9' y='5' width='14' height='22' fill='%232b3654'/%3E%3Ccircle cx='20' cy='16.5' r='1.2' fill='%23f4f1ea'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* A pale hall, so the interface is pale too: white glass, hairline borders,
     one navy accent. The palette commits to a single light world on purpose —
     it is the room, not a document theme. */
  :root{
    color-scheme:light;
    --paper:#f4f1ea;
    --surface:rgba(255,255,255,.72);
    --navy:#2b3654;
    --navy-soft:rgba(43,54,84,.58);
    --line:rgba(43,54,84,.16);
    --ui:'Outfit',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--navy);
    font-family:var(--ui);font-weight:300;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #scene{position:fixed;inset:0;display:block;touch-action:none;outline:none}
  #scene.pointing{cursor:pointer}

  .glass{
    background:var(--surface);border:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }

  /* ---------- HUD ---------- */
  .hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:flex-start;
       justify-content:space-between;gap:16px;padding:clamp(16px,2.4vw,30px);pointer-events:none}
  .hud > *{pointer-events:auto}

  .logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
  .logo .mark{font-size:clamp(20px,2.3vw,28px);font-weight:500;letter-spacing:.24em}
  .logo .sub{
    max-width:16ch;font-size:clamp(8.5px,.95vw,10px);line-height:1.5;letter-spacing:.2em;
    text-transform:uppercase;color:var(--navy-soft);border-left:1px solid var(--line);padding-left:12px;
  }
  @media (max-width:620px){ .logo .sub{display:none} }

  .btn{
    font-family:var(--ui);font-size:clamp(10.5px,1.1vw,12px);font-weight:400;
    letter-spacing:.18em;text-transform:uppercase;color:var(--navy);
    border-radius:999px;padding:.75em 1.35em;cursor:pointer;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .btn:hover,.btn:focus-visible{background:#fff;border-color:var(--navy);transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

  .index{position:relative}
  .index-panel{
    position:absolute;top:calc(100% + 12px);right:0;min-width:248px;margin:0;padding:8px;list-style:none;
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 40px rgba(43,54,84,.12);
  }
  .index-panel[hidden]{display:none}
  .index-panel a{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:.7em .85em;border-radius:9px;text-decoration:none;color:var(--navy);
    font-size:14px;font-weight:300;letter-spacing:.03em;transition:background .18s;
  }
  .index-panel a::after{content:'→';color:var(--navy-soft);transition:transform .18s}
  .index-panel a:hover,.index-panel a:focus-visible{background:rgba(43,54,84,.07);outline:none}
  .index-panel a:hover::after{transform:translateX(3px)}

  /* ---------- hint ---------- */
  .hint{
    position:fixed;left:50%;bottom:clamp(18px,3.4vh,34px);transform:translateX(-50%);z-index:6;
    margin:0;padding:.7em 1.35em;white-space:nowrap;pointer-events:none;border-radius:999px;
    font-size:clamp(10px,1.05vw,11.5px);letter-spacing:.16em;text-transform:uppercase;
    color:var(--navy-soft);transition:opacity .8s ease;
  }
  .hint kbd{
    font:inherit;color:var(--navy);border:1px solid var(--line);
    border-radius:4px;padding:.15em .45em;margin:0 .1em;
  }
  .hint.gone{opacity:0}
  @media (max-width:620px){ .hint .desktop-only{display:none} }

  /* ---------- the floating door prompt ---------- */
  #prompt{
    position:fixed;z-index:5;pointer-events:none;transform:translate(-50%,-50%);
    padding:.5em 1em;border-radius:999px;white-space:nowrap;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);
    background:rgba(255,255,255,.86);border:1px solid var(--line);
    opacity:0;transition:opacity .25s;
  }

  /* ---------- on-screen arrow keys ---------- */
  .pad{
    position:fixed;right:clamp(16px,2.4vw,30px);bottom:clamp(16px,3vh,30px);z-index:7;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    gap:8px;touch-action:none;
  }
  .pad .key{
    width:clamp(44px,5vw,54px);height:clamp(44px,5vw,54px);
    display:grid;place-items:center;padding:0;cursor:pointer;border-radius:11px;
    font-family:var(--ui);font-size:18px;line-height:1;color:var(--navy);
    transition:background .12s,border-color .12s,transform .12s,color .12s;
    -webkit-user-select:none;user-select:none;
  }
  .pad .key:hover{background:#fff;border-color:var(--navy)}
  .pad .key.on{background:var(--navy);border-color:var(--navy);color:var(--paper);transform:translateY(1px) scale(.97)}
  .pad .key:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
  .pad .up{grid-area:1/2}
  .pad .left{grid-area:2/1}
  .pad .down{grid-area:2/2}
  .pad .right{grid-area:2/3}
  .pad.idle .key{animation:padHint 2.8s ease-in-out infinite}
  .pad.idle .up{animation-delay:.15s}
  @keyframes padHint{
    0%,72%,100%{border-color:var(--line)}
    80%{border-color:var(--navy)}
  }
  @media (prefers-reduced-motion:reduce){ .pad.idle .key{animation:none} }
  @media (max-width:620px){
    .pad{left:50%;right:auto;transform:translateX(-50%);bottom:20px}
    .pad .key{width:56px;height:56px;font-size:21px}
    .hint{bottom:152px}
  }

  /* ---------- door popup ---------- */
  .modal{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;
    background:rgba(244,241,234,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s;
  }
  .modal.on{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(440px,100%);padding:clamp(30px,4vw,44px);text-align:center;
    background:#fff;border:1px solid var(--line);border-radius:18px;
    box-shadow:0 30px 70px rgba(43,54,84,.16);
    transform:translateY(14px) scale(.98);transition:transform .38s cubic-bezier(.2,.9,.3,1.05);
  }
  .modal.on .card{transform:none}
  .kicker{margin:0 0 1em;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--navy-soft)}
  .card h2{
    margin:0 0 .5em;font-family:var(--serif);font-weight:400;
    font-size:clamp(27px,3.6vw,38px);line-height:1.1;letter-spacing:-.01em;
  }
  .card p.blurb{margin:0 0 2em;font-size:clamp(14px,1.5vw,15.5px);line-height:1.7;color:var(--navy-soft)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .go{
    font-family:var(--ui);font-size:12px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;
    text-decoration:none;color:var(--paper);background:var(--navy);
    border:1px solid var(--navy);border-radius:999px;padding:1em 1.8em;
    transition:transform .2s,opacity .2s;
  }
  .go:hover,.go:focus-visible{transform:translateY(-2px);opacity:.9}
  .card .btn{padding:1em 1.5em}

  /* ---------- loader ---------- */
  .loader{
    position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--paper);
    transition:opacity .7s ease,visibility .7s;
  }
  .loader.done{opacity:0;visibility:hidden}
  .loader .mark{font-size:30px;font-weight:500;letter-spacing:.3em;text-align:center}
  .loader .bar{margin:20px auto 0;width:170px;height:1px;background:var(--line);overflow:hidden}
  .loader .bar i{display:block;height:100%;width:40%;background:var(--navy);animation:slide 1.15s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  .loader .err{margin-top:18px;font-size:13px;color:#9d3b34;max-width:32ch;line-height:1.6;text-align:center}

  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<canvas id="scene" role="application"
        aria-label="Interactive 3D hall. Use the arrow keys to walk to a door, then press Enter to open it. Every door is also listed under the All doors button."></canvas>

<h1 class="sr">IBSU — walk the hall and open the door you need</h1>

<header class="hud">
  <a class="logo" href="https://ibsu.edu.ge/en/entrant/" target="_blank" rel="noopener"
     aria-label="IBSU, International Black Sea University — entrant pages">
    <span class="mark">IBSU</span>
    <span class="sub">International Black Sea University</span>
  </a>
  <div class="index">
    <button class="btn glass" id="indexBtn" aria-expanded="false" aria-controls="indexPanel">All doors</button>
    <ul class="index-panel" id="indexPanel" hidden></ul>
  </div>
</header>

<p class="hint glass" id="hint">
  <span class="desktop-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to walk &nbsp;·&nbsp; click the floor to go there &nbsp;·&nbsp; </span>click a door to open it
</p>

<div class="pad idle" id="pad" role="group" aria-label="Walk controls">
  <button class="key glass up" data-key="ArrowUp" type="button" aria-label="Walk forward">↑</button>
  <button class="key glass left" data-key="ArrowLeft" type="button" aria-label="Walk left">←</button>
  <button class="key glass down" data-key="ArrowDown" type="button" aria-label="Walk back">↓</button>
  <button class="key glass right" data-key="ArrowRight" type="button" aria-label="Walk right">→</button>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card">
    <p class="kicker">You opened the door to</p>
    <h2 id="mTitle">Programs</h2>
    <p class="blurb" id="mBlurb"></p>
    <div class="actions">
      <a class="go" id="mGo" href="https://ibsu.edu.ge/en/entrant/" target="_blank" rel="noopener">Enter the room</a>
      <button class="btn glass" id="mBack">Stay in the hall</button>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div>
    <div class="mark">IBSU</div>
    <div class="bar"><i></i></div>
    <p class="err" id="loadErr" hidden></p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./app.js"></script>
<script>
  // if the module never boots (old browser, blocked file) say so instead of hanging on the loader
  setTimeout(() => {
    if (!document.getElementById('loader').classList.contains('done')){
      const e = document.getElementById('loadErr');
      e.hidden = false;
      e.textContent = 'The 3D hall could not start. Use the “All doors” menu to reach every page.';
    }
  }, 9000);
</script>
</body>
</html>
