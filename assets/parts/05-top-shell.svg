<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Top housing shell">
  <defs>
    <linearGradient id="tsBody" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3a3d43"/>
      <stop offset=".28" stop-color="#1c1e22"/>
      <stop offset=".62" stop-color="#121417"/>
      <stop offset="1" stop-color="#25282d"/>
    </linearGradient>
    <linearGradient id="tsSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="tsEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5e66"/>
      <stop offset=".5" stop-color="#2b2e33"/>
      <stop offset="1" stop-color="#4c5057"/>
    </linearGradient>
  </defs>

  <!-- lid body -->
  <rect x="40" y="40" width="560" height="340" rx="42" fill="url(#tsBody)" stroke="url(#tsEdge)" stroke-width="3"/>
  <rect x="40" y="40" width="560" height="340" rx="42" fill="url(#tsSheen)"/>

  <!-- red trim inlay -->
  <rect x="58" y="58" width="524" height="304" rx="34" fill="none" stroke="#E10600" stroke-width="3" opacity=".9"/>
  <rect x="70" y="70" width="500" height="280" rx="28" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="2"/>

  <!-- brushed texture -->
  <g stroke="#ffffff" stroke-opacity=".035" stroke-width="1">
    <path d="M92 104h456"/><path d="M92 122h456"/><path d="M92 140h456"/><path d="M92 158h456"/>
    <path d="M92 176h456"/><path d="M92 194h456"/><path d="M92 212h456"/><path d="M92 230h456"/>
    <path d="M92 248h456"/><path d="M92 266h456"/><path d="M92 284h456"/><path d="M92 302h456"/>
  </g>

  <!-- embossed wordmark plate -->
  <rect x="196" y="168" width="248" height="84" rx="14" fill="#0d0e11" stroke="#3a3d43" stroke-width="1.5" opacity=".9"/>
  <g fill="#7c8189">
    <rect x="222" y="198" width="18" height="8" rx="4"/>
    <rect x="248" y="198" width="42" height="8" rx="4"/>
    <rect x="298" y="198" width="26" height="8" rx="4"/>
    <rect x="332" y="198" width="60" height="8" rx="4"/>
  </g>
  <circle cx="404" cy="202" r="6" fill="#E10600"/>
  <g fill="#4a4e55"><rect x="222" y="218" width="140" height="5" rx="2.5"/></g>

  <!-- status LED window -->
  <rect x="470" y="96" width="66" height="26" rx="13" fill="#08090b" stroke="#3a3d43" stroke-width="1.5"/>
  <circle cx="490" cy="109" r="6" fill="#E10600"/>
  <circle cx="516" cy="109" r="6" fill="#2f3339"/>

  <!-- corner screws -->
  <g>
    <circle cx="96" cy="96" r="15" fill="#191b1f" stroke="#666b73" stroke-width="2"/>
    <circle cx="544" cy="96" r="15" fill="#191b1f" stroke="#666b73" stroke-width="2"/>
    <circle cx="96" cy="324" r="15" fill="#191b1f" stroke="#666b73" stroke-width="2"/>
    <circle cx="544" cy="324" r="15" fill="#191b1f" stroke="#666b73" stroke-width="2"/>
    <g stroke="#9aa0a8" stroke-width="2.5" stroke-linecap="round">
      <path d="M89 96h14"/><path d="M537 96h14"/><path d="M89 324h14"/><path d="M537 324h14"/>
      <path d="M96 89v14"/><path d="M544 89v14"/><path d="M96 317v14"/><path d="M544 317v14"/>
    </g>
  </g>

  <!-- vent slots -->
  <g fill="#08090b" opacity=".85">
    <rect x="112" y="286" width="54" height="7" rx="3.5"/>
    <rect x="112" y="300" width="54" height="7" rx="3.5"/>
    <rect x="474" y="286" width="54" height="7" rx="3.5"/>
    <rect x="474" y="300" width="54" height="7" rx="3.5"/>
  </g>
</svg>
