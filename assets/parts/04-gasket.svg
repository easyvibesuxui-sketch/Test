<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="IP68 sealing gasket">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset=".45" stop-color="#E10600"/>
      <stop offset="1" stop-color="#8c0400"/>
    </linearGradient>
    <filter id="sealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#sealGlow)">
    <rect x="62" y="62" width="516" height="296" rx="38" fill="none" stroke="url(#seal)" stroke-width="16"/>
  </g>
  <rect x="62" y="62" width="516" height="296" rx="38" fill="none" stroke="#ff8b80" stroke-width="2.5" opacity=".55"/>

  <!-- compression lugs -->
  <g fill="#E10600">
    <rect x="150" y="46" width="34" height="14" rx="7"/>
    <rect x="456" y="46" width="34" height="14" rx="7"/>
    <rect x="150" y="360" width="34" height="14" rx="7"/>
    <rect x="456" y="360" width="34" height="14" rx="7"/>
    <rect x="46" y="182" width="14" height="56" rx="7"/>
    <rect x="580" y="182" width="14" height="56" rx="7"/>
  </g>
</svg>
